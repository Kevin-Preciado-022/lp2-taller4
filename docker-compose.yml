services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      - DATABASE_URL=postgresql://taller4_user:Cielo_Rojo_1@database:5432/taller4_db
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000" # temporal, para probar /docs antes del reverse proxy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000" # temporal, para verificar diseño antes del proxy
    depends_on:
      - api

volumes:
  pgdata:

